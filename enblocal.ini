; ENBLocal.ini - Mossy ENB Visual Enhancements
; Local hardware/system settings for ENBSeries in Fallout 4
; These settings are NOT shared between computers – tune to YOUR hardware.
; -----------------------------------------------------------------------

[PROXY]
; Set EnableProxyLibrary=true only if you need a separate d3d11 proxy (e.g. ReShade).
EnableProxyLibrary=false
InitProxyFunctions=true
ProxyLibrary=

[GLOBAL]
; UsePatchSpeedhack patches the game exe timer for slightly smoother frame pacing.
UsePatchSpeedhack=false
; AutodetectVideoMemorySize lets ENB measure VRAM automatically. Set false and
; fill VideoMemorySizeMb manually if auto-detection is wrong on your system.
AutodetectVideoMemorySize=true
VideoMemorySizeMb=0

[MEMORY]
; ExpandSystemMemoryX64 expands the system-memory pool; helps prevent texture
; streaming stalls on large open-world cells.
ExpandSystemMemoryX64=true
; ReduceSystemMemoryUsage frees unused CPU-side texture copies faster.
ReduceSystemMemoryUsage=true
; DisableDriverMemoryManager disables ENB's own driver memory manager. Leave
; false unless you encounter VRAM-related crashes.
DisableDriverMemoryManager=false
; DisablePreloadToVRAM improves initial load time at the cost of micro-stutter
; on first-visit cells.
DisablePreloadToVRAM=false
; EnableUnsafeMemoryHacks – NEVER enable; causes crashes.
EnableUnsafeMemoryHacks=false
ReservedMemorySizeMb=512
VideoMemorySizeMb=4096

[THREADS]
; DataSyncMode=0 is the safest and most compatible synchronisation mode.
DataSyncMode=0
; PriorityMode=3 gives ENB rendering threads high priority.
PriorityMode=3

[WINDOW]
; ForceBorderless lets ENB run in a true borderless-fullscreen window for the
; best alt-tab compatibility and lowest input latency.
ForceBorderless=false
ForceBorderlessFullscreen=false

[ENGINE]
; ForceAnisotropicFiltering and MaxAnisotropy ensure crisp distant textures
; without needing AF forced through the GPU driver panel.
ForceAnisotropicFiltering=true
MaxAnisotropy=16
; EnableVSync – disable in favour of in-game or RTSS frame-cap to prevent
; input lag while still avoiding tearing.
EnableVSync=false
VSyncSkipNumFrames=0
; EnableFpsLimit caps the frame rate. Set FpsLimit to your monitor refresh
; rate (or a stable fraction of it) to prevent frame-time spikes.
EnableFpsLimit=true
FpsLimit=60.0
; ForceResolution overrides the game resolution; leave false to use the game
; settings dialog.
ForceResolution=false
ForceRenderWidth=0
ForceRenderHeight=0
