; ReShade.ini - Mossy ENB Visual Enhancements
; Global ReShade configuration for Fallout 4.
;
; INSTALLATION
; ------------
; 1. Download ReShade from https://reshade.me and install it for Fallout 4
;    using the DirectX 11 path.  When prompted choose dxgi.dll as the hook DLL.
; 2. Copy the entire reshade/ directory into your Fallout 4 root folder
;    (the folder containing Fallout4.exe).
; 3. Enable the ENB proxy so that ENB loads first and ReShade loads second:
;
;    In enblocal.ini:
;      [PROXY]
;      EnableProxyLibrary=true
;      ProxyLibrary=dxgi.dll
;
; 4. Use the optimizer tool to choose a preset tier:
;
;      python enb_optimizer.py reshade apply --preset balanced
;      python enb_optimizer.py reshade apply --auto
;
; 5. Download the required shader packs from Nexus Mods / GitHub and place
;    them in reshade-shaders/Shaders/ and reshade-shaders/Textures/.
;    Required:  iMMERSE (free)   — https://github.com/martymcmodding/iMMERSE
;    Optional:  iMMERSE Pro      — https://www.patreon.com/mcflypg  (RTGI)
;               qUINT            — https://github.com/martymcmodding/qUINT
;               SMAA             — bundled with ReShade installer
; -----------------------------------------------------------------------

[GENERAL]
; EffectSearchPaths / TextureSearchPaths tell ReShade where to find .fx and
; texture files.  Paths are relative to the Fallout 4 root folder.
EffectSearchPaths=.\reshade-shaders\Shaders
TextureSearchPaths=.\reshade-shaders\Textures

; PresetPath points to the active preset.  Managed automatically by the
; optimizer tool (python enb_optimizer.py reshade apply --preset <name>).
PresetPath=.\reshade-presets\Mossy_balanced.ini

; PerformanceMode compiles all shaders to a single optimised binary.
; Set to 1 after you are happy with your preset for a small FPS gain.
PerformanceMode=0

PreprocessorDefinitions=

[OVERLAY]
; TutorialProgress=4 skips the first-launch tutorial.
TutorialProgress=4
NoFontScaling=0
ShowFPS=0
ShowClock=0
ShowFrameTime=0
SaveWindowState=0

[STYLE]
Alpha=1.000000
ChildRounding=0.000000
ColFPSText=1.000000 1.000000 0.784314 1.000000
