; Mossy_screenshot.ini - Mossy ENB  |  ReShade Screenshot / Cinematic Preset
; NOT intended for gameplay — the DoF and film-grain pass add too much overhead
; and visual change for everyday play.  Switch to this preset only when taking
; screenshots or recording cinematic footage.
;
; Active effects (in render order)
; ----------------------------------
; MXAO             (iMMERSE free)  — maximum-sample AO + indirect lighting
; iMMERSE_RTGI     (iMMERSE Pro)   — full ray-traced GI at native resolution
; Bloom            (qUINT)         — physically-based bloom / lens flare
; LUT              (iMMERSE)       — film LUT: Kodak Vision3 500T emulation
; FilmGrain        (qUINT)         — analogue film grain overlay
; DOF              (qUINT)         — cinematic depth-of-field (Bokeh)
; SMAA             (bundled)       — high-quality anti-aliasing
; AdaptiveSharpen  (qUINT)         — strong sharpening
;
; Required shader packs
; ---------------------
; iMMERSE (free):   https://github.com/martymcmodding/iMMERSE
; iMMERSE Pro:      https://www.patreon.com/mcflypg
; qUINT (free):     https://github.com/martymcmodding/qUINT
;
; LUT texture
; -----------
; Copy MossyLUT.png from reshade/reshade-textures/ into:
;   <Fallout4>\reshade-shaders\Textures\
; Run tools/generate_lut.py first if the file is missing.

[PRESET]
Techniques=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,Bloom@Bloom.fx,LUT@LUT.fx,FilmGrain@FilmGrain.fx,DOF@DOF.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx
TechniqueSorting=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,Bloom@Bloom.fx,LUT@LUT.fx,FilmGrain@FilmGrain.fx,DOF@DOF.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx

; ---------------------------------------------------------------------------
; iMMERSE MXAO  —  Horizon-Based Ambient Occlusion (maximum quality + IL)
; ---------------------------------------------------------------------------
[MXAO.fx]
; 64 samples — screenshot quality; no concern for real-time cost.
MXAO_SAMPLE_COUNT=64
MXAO_ENABLE_IL=1
fAOMultiplier=3.00
fAORadius=3.50
fAOFadeDepth_Far=0.9900
fAOFadeDepth_Near=0.0500
bHardwareDepthLinearisation=1

; ---------------------------------------------------------------------------
; iMMERSE RTGI  —  Ray-Traced Global Illumination (full GI, native res)
; ---------------------------------------------------------------------------
[iMMERSE_RTGI.fx]
RTGI_RENDER_SCALE=1
RTGI_RAY_COUNT=16
RTGI_RAY_STEPS=32
RTGI_ENABLE_GI=1
fRTGIIlluminanceRadius=1.50
fRTGIAOMultiplier=1.20
fRTGIGIMultiplier=0.60

; ---------------------------------------------------------------------------
; Bloom  —  Physically-Based Lens Bloom (qUINT)
; ---------------------------------------------------------------------------
[Bloom.fx]
; Threshold: only the brightest pixels feed the bloom.
fBloomThreshold=0.700
; Bloom intensity — moderate so it doesn't wash out colour detail.
fBloomAmount=0.280
; Wide radius gives a natural lens-flare halo on bright light sources.
fBloomRadius=0.800
; Saturation boost lets ENB's subsurface scattering colour show in the bloom.
fBloomSaturation=1.20

; ---------------------------------------------------------------------------
; LUT  —  Film Look (iMMERSE LUT.fx)
; ---------------------------------------------------------------------------
[LUT.fx]
; MossyLUT.png: Kodak Vision3 500T tungsten film emulation.
; Generated by tools/generate_lut.py — replace with any 512×512 Hald CLUT.
fLUT_AmountChroma=0.85
fLUT_AmountLuma=0.85
sLUTTexture=MossyLUT.png

; ---------------------------------------------------------------------------
; FilmGrain  —  Analogue Film Grain (qUINT)
; ---------------------------------------------------------------------------
[FilmGrain.fx]
; Intensity: subtle grain — mimics ISO 800 film stock.
fGrainAmount=0.12
fGrainSize=1.80
; Coloured grain (chromatic) for a warmer, analogue feel.
bColored=1
fColorAmount=0.30
fLumAmount=1.00

; ---------------------------------------------------------------------------
; DOF  —  Cinematic Depth-of-Field / Bokeh (qUINT)
; ---------------------------------------------------------------------------
[DOF.fx]
; Focal plane distance — 0.03 focuses on subjects a few metres away.
fDOFFocalPlane=0.030
; Aperture: f/2.8 equivalent — large, cinematic bokeh circles.
fDOFAperture=2.80
; Bokeh samples: high for smooth circles.
iDOFQuality=8
; Bokeh shape: hexagonal (6-bladed aperture).
iDOFBokehShape=2

; ---------------------------------------------------------------------------
; SMAA  —  Subpixel Morphological Anti-Aliasing (maximum quality)
; ---------------------------------------------------------------------------
[SMAA.fx]
EdgeDetectionType=2
EdgeDetectionThreshold=0.060
MaxSearchSteps=98
MaxSearchStepsDiagonal=16
CornerRounding=25

; ---------------------------------------------------------------------------
; AdaptiveSharpen  —  Contrast-Adaptive Sharpening
; ---------------------------------------------------------------------------
[AdaptiveSharpen.fx]
; Stronger than gameplay presets — compensates for DoF softness.
curve_height=0.55
L_compr_low=0.169
D_compr_low=0.253
