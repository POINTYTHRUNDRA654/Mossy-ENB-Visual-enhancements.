; Mossy_ultra.ini - Mossy ENB  |  ReShade Ultra / Showcase Preset
; Target: RTX 3080+ / RX 7900 XT+ — maximum visual fidelity.
;
; Active effects
; --------------
; MXAO             (iMMERSE free) — maximum-sample ambient occlusion + IL
; iMMERSE_RTGI     (iMMERSE Pro)  — full ray-traced GI and occlusion
; SMAA             (bundled)      — high-quality anti-aliasing
; AdaptiveSharpen  (qUINT)        — strong sharpening
;
; NOTE: iMMERSE_RTGI requires iMMERSE Pro (Patreon).
;   If you do not have it, remove iMMERSE_RTGI from Techniques and
;   TechniqueSorting and the preset will still function correctly.
;
; WARNING: Full GI (RTGI_ENABLE_GI=1) at render scale 1 is very expensive.
;   Expect 10-20 FPS cost on an RTX 3080 depending on scene complexity.

[PRESET]
Techniques=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx
TechniqueSorting=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx

; ---------------------------------------------------------------------------
; iMMERSE MXAO  —  Horizon-Based Ambient Occlusion (maximum quality + IL)
; ---------------------------------------------------------------------------
[MXAO.fx]
; 64 samples: showcase-quality AO.
MXAO_SAMPLE_COUNT=64
; Indirect lighting enabled — adds soft colour bounce in deep crevices.
MXAO_ENABLE_IL=1
fAOMultiplier=3.00
fAORadius=3.50
fAOFadeDepth_Far=0.9900
fAOFadeDepth_Near=0.0500
bHardwareDepthLinearisation=1

; ---------------------------------------------------------------------------
; iMMERSE RTGI  —  Ray-Traced Global Illumination (full GI mode)
; ---------------------------------------------------------------------------
[iMMERSE_RTGI.fx]
; Render scale 1 = full resolution — highest quality, highest cost.
RTGI_RENDER_SCALE=1
; 16 rays × 32 steps per pixel.
RTGI_RAY_COUNT=16
RTGI_RAY_STEPS=32
; Full GI colour bounce enabled.
RTGI_ENABLE_GI=1
fRTGIIlluminanceRadius=1.50
fRTGIAOMultiplier=1.20
fRTGIGIMultiplier=0.60

; ---------------------------------------------------------------------------
; SMAA  —  Subpixel Morphological Anti-Aliasing (high-quality mode)
; ---------------------------------------------------------------------------
[SMAA.fx]
; Colour-based edge detection — more accurate, slightly more expensive.
EdgeDetectionType=2
EdgeDetectionThreshold=0.060
MaxSearchSteps=98
MaxSearchStepsDiagonal=16
CornerRounding=25

; ---------------------------------------------------------------------------
; AdaptiveSharpen  —  Contrast-Adaptive Sharpening
; ---------------------------------------------------------------------------
[AdaptiveSharpen.fx]
curve_height=0.45
L_compr_low=0.169
D_compr_low=0.253
