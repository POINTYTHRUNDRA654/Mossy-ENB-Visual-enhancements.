; Mossy_balanced.ini - Mossy ENB  |  ReShade Balanced Preset
; Target: RTX 2070 / RX 6700 XT — quality uplift with room for 60 FPS.
;
; Active effects
; --------------
; MXAO             (iMMERSE free) — medium-sample ambient occlusion
; iMMERSE_RTGI     (iMMERSE Pro)  — screen-space ray-traced occlusion + light
; SMAA             (bundled)      — anti-aliasing
; AdaptiveSharpen  (qUINT)        — sharpening
;
; NOTE: iMMERSE_RTGI requires iMMERSE Pro (Patreon).
;   If you do not have it, remove iMMERSE_RTGI from Techniques and
;   TechniqueSorting and the preset will still function correctly.

[PRESET]
Techniques=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx
TechniqueSorting=MXAO@MXAO.fx,iMMERSE_RTGI@iMMERSE_RTGI.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx

; ---------------------------------------------------------------------------
; iMMERSE MXAO  —  Horizon-Based Ambient Occlusion (medium quality)
; ---------------------------------------------------------------------------
[MXAO.fx]
; 24 samples: good quality at medium cost.
MXAO_SAMPLE_COUNT=24
MXAO_ENABLE_IL=0
fAOMultiplier=2.50
fAORadius=2.50
fAOFadeDepth_Far=0.9900
fAOFadeDepth_Near=0.1000
bHardwareDepthLinearisation=1

; ---------------------------------------------------------------------------
; iMMERSE RTGI  —  Ray-Traced Global Illumination (AO mode only)
; ---------------------------------------------------------------------------
[iMMERSE_RTGI.fx]
; Render scale 2 = quarter resolution — good balance of quality vs cost.
RTGI_RENDER_SCALE=2
; 8 rays × 16 steps per pixel.
RTGI_RAY_COUNT=8
RTGI_RAY_STEPS=16
; GI colour bounce disabled at this tier — AO only.
RTGI_ENABLE_GI=0
fRTGIIlluminanceRadius=1.00
fRTGIAOMultiplier=1.00
fRTGIGIMultiplier=0.00

; ---------------------------------------------------------------------------
; SMAA  —  Subpixel Morphological Anti-Aliasing
; ---------------------------------------------------------------------------
[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25

; ---------------------------------------------------------------------------
; AdaptiveSharpen  —  Contrast-Adaptive Sharpening
; ---------------------------------------------------------------------------
[AdaptiveSharpen.fx]
curve_height=0.40
L_compr_low=0.169
D_compr_low=0.253
