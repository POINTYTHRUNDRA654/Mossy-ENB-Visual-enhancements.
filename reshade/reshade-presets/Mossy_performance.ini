; Mossy_performance.ini - Mossy ENB  |  ReShade Performance Preset
; Target: GTX 1060 / RX 580 — minimal GPU overhead from ReShade.
;
; Active effects
; --------------
; MXAO        (iMMERSE free) — low-sample ambient occlusion
; SMAA        (bundled)      — anti-aliasing
; AdaptiveSharpen (qUINT)    — light sharpening to counteract TAA blur
;
; RTGI: DISABLED — not loaded in this tier.

[PRESET]
Techniques=MXAO@MXAO.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx
TechniqueSorting=MXAO@MXAO.fx,SMAA@SMAA.fx,AdaptiveSharpen@AdaptiveSharpen.fx

; ---------------------------------------------------------------------------
; iMMERSE MXAO  —  Horizon-Based Ambient Occlusion
; ---------------------------------------------------------------------------
[MXAO.fx]
; Sample count: 16 gives acceptable AO without a heavy GPU cost.
MXAO_SAMPLE_COUNT=16
; Indirect lighting off — too expensive at this tier.
MXAO_ENABLE_IL=0
; AO strength.
fAOMultiplier=2.00
; AO radius in world units.
fAORadius=1.80
; Depth fade — AO fades out beyond this scene depth (0–1).
fAOFadeDepth_Far=0.9900
fAOFadeDepth_Near=0.1000
; Use the hardware linearized depth buffer for better accuracy.
bHardwareDepthLinearisation=1

; ---------------------------------------------------------------------------
; SMAA  —  Subpixel Morphological Anti-Aliasing
; ---------------------------------------------------------------------------
[SMAA.fx]
; Luma-based edge detection (fastest).
EdgeDetectionType=1
EdgeDetectionThreshold=0.100
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25

; ---------------------------------------------------------------------------
; AdaptiveSharpen  —  Contrast-Adaptive Sharpening
; ---------------------------------------------------------------------------
[AdaptiveSharpen.fx]
; Mild sharpening — recovers TAA softness without adding ringing.
curve_height=0.35
L_compr_low=0.169
D_compr_low=0.253
