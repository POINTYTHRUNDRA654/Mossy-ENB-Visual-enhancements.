; enbseries_ultra.ini - Mossy ENB  |  Ultra / Showcase Preset
; Target: uncapped FPS / 30-40 FPS on high-end GPUs (RTX 3080+ / RX 7900 XT+).
; Everything on at maximum quality – for screenshots and powerful rigs.

[GLOBAL]
UseEffect=true

[SSAO_SSIL]
EnableAmbientOcclusion=true
AOType=2
SamplingRange=0.70
SamplingBias=0.03
SamplingStep=16
Quality=3
EnableIL=true

[DEPTHOFFIELDQUALITY]
QualityDOF=3

[REFLECTION]
Quality=3

[SUBSURFACESCATTERING]
EnableSubSurfaceScattering=true
SubSurfaceScatteringRadius=0.25
SubSurfaceScatteringScale=0.75
SubSurfaceScatteringPower=1.00

[SKYLIGHTING]
EnableSkyLighting=true
SkyLightingIntensity=1.00
SkyLightingDesaturate=0.15

[INDIRECT]
EnableIndirectLighting=true

[BLOOM]
EnableBloom=true
BloomAmount=0.140
BloomThreshold=0.60
BloomIntensity=1.10
BloomSaturation=1.15
BloomRadius=0.90

[TONEMAPPING]
ToneMappingCurve=3
EyeAdaptationMinValue=0.20
EyeAdaptationMaxValue=3.00
EyeAdaptationSensitivity=0.60
EyeAdaptationSpeed=0.70

[COLORCORRECTION]
ColorCorrectionBrightness=0.00
ColorCorrectionContrast=0.07
ColorCorrectionSaturation=0.12
ColorCorrectionGamma=1.00

[LENS]
EnableLens=true
EnableLensFog=true
ChromaticAberration=0.008
LensIntensity=0.12

[DETAILSHADOW]
EnableDetailedShadow=true
DetailedShadowQuality=3
DetailedShadowMultiplier=1.10
DetailedShadowBias=0.001

[SHADOW]
EnableShadow=true

[SKY]
EnableSky=true

[WATER]
EnableWater=true
EnableWaterReflection=true
WaterReflectionQuality=3

[PARTICLELIGHTS]
EnableParticleLights=true
EnableParticleLightsShadows=true
ParticleLightsIntensity=1.10
ParticleLightsRadius=1.10

[COMPLEXFIRE]
; ENB re-lights fire emitters using particle lights so they cast coloured shadows
; and interact with SSAO/IL. Requires EnableParticleLights=true above.
EnableComplexFire=true
FireIntensity=1.20
FireRadius=1.40

[COMPLEXPARTICLES]
; ENB processes emissive particles (muzzle flashes, sparks, magic effects) as
; real light sources. Each active emitter is a full particle light — expensive
; in heavy combat but dramatically more realistic.
EnableComplexParticles=true

[ENVIRONMENT]
EnableCubemap=true
CubemapIntensity=0.80

[POSTPROCESS]
EffectPostProcess=true

[SHARPENING]
EnableSharpening=true
SharpeningStrength=0.45
SharpeningClamp=0.020

[ANTIALIASING]
EnableEdgeAA=false

[VOLUMETRICRAYS]
EnableVolumetricRays=true
VolumetricRaysQuality=2
VolumetricRaysIntensity=0.90

[FIX]
FixGameBugs=true
FixToneMappingBug=true
FixSsaoHairBug=true
FixAmbientLightingBug=true
FixCursorInMenus=true
FixLag=true
