; enbseries_performance.ini - Mossy ENB  |  Performance Preset
; Target: 60+ FPS on mid-range GPUs (GTX 1060 / RX 580 and above).
; Compromise: SSAO quality reduced, no detailed shadows, no volumetric rays.

[GLOBAL]
UseEffect=true

[SSAO_SSIL]
EnableAmbientOcclusion=true
AOType=0
SamplingRange=0.45
SamplingBias=0.05
SamplingStep=4
Quality=0
EnableIL=false

[DEPTHOFFIELDQUALITY]
QualityDOF=1

[REFLECTION]
Quality=0

[SUBSURFACESCATTERING]
EnableSubSurfaceScattering=false

[SKYLIGHTING]
EnableSkyLighting=false

[INDIRECT]
EnableIndirectLighting=false

[BLOOM]
EnableBloom=true
BloomAmount=0.100
BloomThreshold=0.70
BloomIntensity=0.90
BloomSaturation=1.00
BloomRadius=0.65

[TONEMAPPING]
ToneMappingCurve=2
EyeAdaptationMinValue=0.30
EyeAdaptationMaxValue=2.00
EyeAdaptationSensitivity=0.50
EyeAdaptationSpeed=0.90

[COLORCORRECTION]
ColorCorrectionBrightness=0.00
ColorCorrectionContrast=0.02
ColorCorrectionSaturation=0.08
ColorCorrectionGamma=1.00

[LENS]
EnableLens=false

[DETAILSHADOW]
EnableDetailedShadow=false

[SHADOW]
EnableShadow=true

[SKY]
EnableSky=true

[WATER]
EnableWater=true
EnableWaterReflection=false
WaterReflectionQuality=0

[PARTICLELIGHTS]
EnableParticleLights=true
EnableParticleLightsShadows=false
ParticleLightsIntensity=1.00
ParticleLightsRadius=1.00

[ENVIRONMENT]
EnableCubemap=true
CubemapIntensity=0.70

[POSTPROCESS]
EffectPostProcess=true

[SHARPENING]
EnableSharpening=true
SharpeningStrength=0.25
SharpeningClamp=0.025

[ANTIALIASING]
EnableEdgeAA=false

[VOLUMETRICRAYS]
EnableVolumetricRays=false

[FIX]
FixGameBugs=true
FixToneMappingBug=true
FixSsaoHairBug=false
FixAmbientLightingBug=true
FixCursorInMenus=true
FixLag=true
