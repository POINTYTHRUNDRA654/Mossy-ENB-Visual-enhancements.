; enbseries_balanced.ini - Mossy ENB  |  Balanced Preset
; Target: 60 FPS on high-end mid-range GPUs (RTX 2070 / RX 6700 XT and above).
; This is a copy of the root enbseries.ini for convenient switching.

[GLOBAL]
UseEffect=true

[SSAO_SSIL]
EnableAmbientOcclusion=true
AOType=1
SamplingRange=0.55
SamplingBias=0.05
SamplingStep=8
Quality=2
EnableIL=false

[DEPTHOFFIELDQUALITY]
QualityDOF=2

[REFLECTION]
Quality=2

[SUBSURFACESCATTERING]
EnableSubSurfaceScattering=true
SubSurfaceScatteringRadius=0.20
SubSurfaceScatteringScale=0.65
SubSurfaceScatteringPower=0.90

[SKYLIGHTING]
EnableSkyLighting=true
SkyLightingIntensity=0.85
SkyLightingDesaturate=0.20

[INDIRECT]
EnableIndirectLighting=true

[BLOOM]
EnableBloom=true
BloomAmount=0.120
BloomThreshold=0.65
BloomIntensity=1.00
BloomSaturation=1.10
BloomRadius=0.80

[TONEMAPPING]
ToneMappingCurve=3
EyeAdaptationMinValue=0.25
EyeAdaptationMaxValue=2.50
EyeAdaptationSensitivity=0.55
EyeAdaptationSpeed=0.80

[COLORCORRECTION]
ColorCorrectionBrightness=0.00
ColorCorrectionContrast=0.05
ColorCorrectionSaturation=0.10
ColorCorrectionGamma=1.00

[LENS]
EnableLens=true
EnableLensFog=false
ChromaticAberration=0.005
LensIntensity=0.08

[DETAILSHADOW]
EnableDetailedShadow=true
DetailedShadowQuality=2
DetailedShadowMultiplier=1.00
DetailedShadowBias=0.002

[SHADOW]
EnableShadow=true

[SKY]
EnableSky=true

[WATER]
EnableWater=true
EnableWaterReflection=true
WaterReflectionQuality=2

[PARTICLELIGHTS]
EnableParticleLights=true
EnableParticleLightsShadows=false
ParticleLightsIntensity=1.00
ParticleLightsRadius=1.00

[ENVIRONMENT]
EnableCubemap=true
CubemapIntensity=0.70

[POSTPROCESS]
EffectPostProcess=true

[SHARPENING]
EnableSharpening=true
SharpeningStrength=0.35
SharpeningClamp=0.025

[ANTIALIASING]
EnableEdgeAA=false

[VOLUMETRICRAYS]
EnableVolumetricRays=true
VolumetricRaysQuality=1
VolumetricRaysIntensity=0.80

[FIX]
FixGameBugs=true
FixToneMappingBug=true
FixSsaoHairBug=true
FixAmbientLightingBug=true
FixCursorInMenus=true
FixLag=true
